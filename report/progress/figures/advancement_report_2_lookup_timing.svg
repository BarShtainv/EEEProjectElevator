<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Credential repository lookup timing</title><desc id="desc">Credential repository lookup timing. Three measured repetitions are shown for each credential size. The line is the median of repetition-level average nanoseconds. Whiskers show minimum and maximum repetition-level averages. Points are individual repetition averages. Measures direct CredentialRepository.lookup, including key validation, dictionary lookup, and result-wrapper construction; repository construction is excluded. Host-software observations only; no hardware or real-time guarantee.</desc><rect x="0" y="0" width="960" height="600" fill="white" /><line x1="105" y1="455" x2="900" y2="455" stroke="#cccccc" stroke-width="1" /><text x="95" y="460" text-anchor="end" font-size="13" fill="black">0</text><line x1="105" y1="379" x2="900" y2="379" stroke="#cccccc" stroke-width="1" /><text x="95" y="384" text-anchor="end" font-size="13" fill="black">100</text><line x1="105" y1="303" x2="900" y2="303" stroke="#cccccc" stroke-width="1" /><text x="95" y="308" text-anchor="end" font-size="13" fill="black">200</text><line x1="105" y1="227" x2="900" y2="227" stroke="#cccccc" stroke-width="1" /><text x="95" y="232" text-anchor="end" font-size="13" fill="black">300</text><line x1="105" y1="151" x2="900" y2="151" stroke="#cccccc" stroke-width="1" /><text x="95" y="156" text-anchor="end" font-size="13" fill="black">400</text><line x1="105" y1="75" x2="900" y2="75" stroke="#cccccc" stroke-width="1" /><text x="95" y="80" text-anchor="end" font-size="13" fill="black">500</text><line x1="105" y1="75" x2="105" y2="455" stroke="black" stroke-width="2" /><line x1="105" y1="455" x2="900" y2="455" stroke="black" stroke-width="2" /><line class="whisker" data-size="10" data-min="286.191" data-max="320.778" x1="180" y1="237.49484" x2="180" y2="211.20872" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="10" data-repetition="1" data-value="297.496" x="168" y="225.90304" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10" data-repetition="2" data-value="286.191" x="177" y="234.49484" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10" data-repetition="3" data-value="320.778" x="186" y="208.20872" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="10" data-value="297.496" cx="180" cy="228.90304" r="5" fill="black" /><text x="180" y="478" text-anchor="middle" font-size="14" fill="black">10</text><line class="whisker" data-size="100" data-min="271.767" data-max="306.548" x1="400" y1="248.45708" x2="400" y2="222.02352" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="100" data-repetition="1" data-value="271.767" x="388" y="245.45708" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="100" data-repetition="2" data-value="278.224" x="397" y="240.54976" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="100" data-repetition="3" data-value="306.548" x="406" y="219.02352" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="100" data-value="278.224" cx="400" cy="243.54976" r="5" fill="black" /><text x="400" y="478" text-anchor="middle" font-size="14" fill="black">100</text><line class="whisker" data-size="1000" data-min="291.953" data-max="295.824" x1="620" y1="233.11572" x2="620" y2="230.17376" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="1000" data-repetition="1" data-value="291.953" x="608" y="230.11572" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="1000" data-repetition="2" data-value="292.728" x="617" y="229.52672" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="1000" data-repetition="3" data-value="295.824" x="626" y="227.17376" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="1000" data-value="292.728" cx="620" cy="232.52672" r="5" fill="black" /><text x="620" y="478" text-anchor="middle" font-size="14" fill="black">1000</text><line class="whisker" data-size="10000" data-min="294.767" data-max="416.956" x1="840" y1="230.97708" x2="840" y2="138.11344" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="10000" data-repetition="1" data-value="351.938" x="828" y="184.52712" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10000" data-repetition="2" data-value="294.767" x="837" y="227.97708" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10000" data-repetition="3" data-value="416.956" x="846" y="135.11344" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="10000" data-value="351.938" cx="840" cy="187.52712" r="5" fill="black" /><text x="840" y="478" text-anchor="middle" font-size="14" fill="black">10000</text><polyline class="median-line" points="180,228.90304 400,243.54976 620,232.52672 840,187.52712" fill="none" stroke="black" stroke-width="2.5" stroke-dasharray="7 4" /><text x="502" y="510" text-anchor="middle" font-size="15" fill="black">Credential count</text><text x="28" y="270" text-anchor="middle" font-size="15" fill="black" transform="rotate(-90 28 270)">Repetition average time (ns/lookup)</text><text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="black">Credential repository lookup timing</text><text x="480" y="535" text-anchor="middle" fon