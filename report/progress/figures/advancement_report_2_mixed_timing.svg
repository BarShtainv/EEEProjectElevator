troller request-processing timing</text><text x="480" y="535" text-anchor="middle" font-size="12" fill="black">Three measured repetitions; squares = repetition averages; dashed line/circles = median of repetition-level averages; whiskers = min/max.</text><text x="480" y="558" text-anchor="middle" font-size="11" fill="black">Includes Controller.submit and mixed validation, lookup, authorization, and controller behavior according to the frozen workload; it is not isolated lookup timing.</text><text x="480" y="578" text-anchor="middle" font-size="11" fill="black">Host-software observation only; operation families are not ranked; no hardware or real-time guarantee.</text></svg>
