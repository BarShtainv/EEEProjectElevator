<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Mixed controller request-processing timing</title><desc id="desc">Mixed controller request-processing timing. Three measured repetitions are shown for each credential size. The line is the median of repetition-level average nanoseconds. Whiskers show minimum and maximum repetition-level averages. Points are individual repetition averages. Includes Controller.submit and mixed validation, lookup, authorization, and controller behavior according to the frozen workload; it is not isolated lookup timing. Host-software observations only; no hardware or real-time guarantee.</desc><rect x="0" y="0" width="960" height="600" fill="white" /><line x1="105" y1="455" x2="900" y2="455" stroke="#cccccc" stroke-width="1" /><text x="95" y="460" text-anchor="end" font-size="13" fill="black">0</text><line x1="105" y1="379" x2="900" y2="379" stroke="#cccccc" stroke-width="1" /><text x="95" y="384" text-anchor="end" font-size="13" fill="black">2000</text><line x1="105" y1="303" x2="900" y2="303" stroke="#cccccc" stroke-width="1" /><text x="95" y="308" text-anchor="end" font-size="13" fill="black">4000</text><line x1="105" y1="227" x2="900" y2="227" stroke="#cccccc" stroke-width="1" /><text x="95" y="232" text-anchor="end" font-size="13" fill="black">6000</text><line x1="105" y1="151" x2="900" y2="151" stroke="#cccccc" stroke-width="1" /><text x="95" y="156" text-anchor="end" font-size="13" fill="black">8000</text><line x1="105" y1="75" x2="900" y2="75" stroke="#cccccc" stroke-width="1" /><text x="95" y="80" text-anchor="end" font-size="13" fill="black">10000</text><line x1="105" y1="75" x2="105" y2="455" stroke="black" stroke-width="2" /><line x1="105" y1="455" x2="900" y2="455" stroke="black" stroke-width="2" /><line class="whisker" data-size="10" data-min="7411.127" data-max="8158.465" x1="180" y1="173.377174" x2="180" y2="144.97833" st