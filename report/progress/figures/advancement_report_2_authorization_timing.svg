<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Authorization decision timing</title><desc id="desc">Authorization decision timing. Three measured repetitions are shown for each credential size. The line is the median of repetition-level average nanoseconds. Whiskers show minimum and maximum repetition-level averages. Points are individual repetition averages. Measures direct authorize, including trusted-input validation and decision construction; credential lookup is excluded. Host-software observations only; no hardware or real-time guarantee.</desc><rect x="0" y="0" width="960" height="600" fill="white" /><line x1="105" y1="455" x2="900" y2="455" stroke="#cccccc" stroke-width="1" /><text x="95" y="460" text-anchor="end" font-size="13" fill="black">0</text><line x1="105" y1="360" x2="900" y2="360" stroke="#cccccc" stroke-width="1" /><text x="95" y="365" text-anchor="end" font-size="13" fill="black">200</text><line x1="105" y1="265" x2="900" y2="265" stroke="#cccccc" stroke-width="1" /><text x="95" y="270" text-anchor="end" font-size="13" fill="black">400</text><line x1="105" y1="170" x2="900" y2="170" stroke="#cccccc" stroke-width="1" /><text x="95" y="175" text-anchor="end" font-size="13" fill="black">600</text><line x1="105" y1="75" x2="900" y2="75" stroke="#cccccc" stroke-width="1" /><text x="95" y="80" text-anchor="end" font-size="13" fill="black">800</text><line x1="105" y1="75" x2="105" y2="455" stroke="black" stroke-width="2" /><line x1="105" y1="455" x2="900" y2="455" stroke="black" stroke-width="2" /><line class="whisker" data-size="10" data-min="557.965" data-max="601.094" x1="180" y1="189.966625" x2="180" y2="169.48035" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="10" data-repetition="1" data-value="590.139" x="168" y="171.683975" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10" data-repetition="2" data-value="557.965" x="177" y="186.966625" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10" data-repetition="3" data-value="601.094" x="186" y="166.48035" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="10" data-value="590.139" cx="180" cy="174.683975" r="5" fill="black" /><text x="180" y="478" text-anchor="middle" font-size="14" fill="black">10</text><line class="whisker" data-size="100" data-min="560.972" data-max="623.174" x1="400" y1="188.5383" x2="400" y2="158.99235" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="100" data-repetition="1" data-value="565.264" x="388" y="183.4996" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="100" data-repetition="2" data-value="560.972" x="397" y="185.5383" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="100" data-repetition="3" data-value="623.174" x="406" y="155.99235" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="100" data-value="565.264" cx="400" cy="186.4996" r="5" fill="black" /><text x="400" y="478" text-anchor="middle" font-size="14" fill="black">100</text><line class="whisker" data-size="1000" data-min="599.708" data-max="620.939" x1="620" y1="170.1387" x2="620" y2="160.053975" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="1000" data-repetition="1" data-value="620.939" x="608" y="157.053975" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="1000" data-repetition="2" data-value="599.708" x="617" y="167.1387" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="1000" data-repetition="3" data-value="616.682" x="626" y="159.07605" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="1000" data-value="616.682" cx="620" cy="162.07605" r="5" fill="black" /><text x="620" y="478" text-anchor="middle" font-size="14" fill="black">1000</text><line class="whisker" data-size="10000" data-min="607.636" data-max="627.181" x1="840" y1="166.3729" x2="840" y2="157.089025" stroke="black" stroke-width="2" /><rect class="repetition-point" data-size="10000" data-repetition="1" data-value="627.181" x="828" y="154.089025" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10000" data-repetition="2" data-value="614.437" x="837" y="160.142425" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><rect class="repetition-point" data-size="10000" data-repetition="3" data-value="607.636" x="846" y="163.3729" width="6" height="6" fill="white" stroke="black" stroke-width="1.5" /><circle class="median-point" data-size="10000" data-value="614.437" cx="840" cy="163.142425" r="5" fill="black" /><text x="840" y="478" text-anchor="middle" font-size="14" fill="black">10000</text><polyline class="median-line" points="180,174.683975 400,186.4996 620,162.07605 840,163.142425" fill="none" stroke="black" stroke-width="2.5" stroke-dasharray="7 4" /><text x="502" y="510" text-anchor="middle" font-size="15" fill="black">Credential count</text><text x="28" y="270" text-anchor="middle" font-size="15" fill="black" transform="rotate(-90 28 270)">Repetition average time (ns/decision)</text><text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="black">Authorization decision timing</text><text x="480" y="535" text-anchor="middle" font-size="12" fill="black">Three measured repetitions; squares = repetition averages; dashed line/circles = median of repetition-level averages; whiskers = min/max.</text><text x="480" y="558" text-anchor="middle" font-size="11" fill="black">Measures direct authorize, including trusted-input validation and decision construction; credential lookup is excluded.</text><text x="480" y="578" text-anchor="middle" font-size="11" fill="black">Host-software observation only; operation families are not ranked; no hardware or real-time guarantee.</text></svg>
