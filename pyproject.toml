[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-access-sim"
version = "0.1.0"
description = "Software-only simulator for an abstract elevator access-control model"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elevator-access-sim = "elevator_access_sim.cli:run"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
